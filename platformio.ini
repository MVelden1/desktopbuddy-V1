; desktopbuddy: per versie en per doel een eigen omgeving (env)

[platformio]
; wat "Build" standaard bouwt; zet op v1 zodra je het echte bord hebt
default_envs = v1-wokwi

; geldt voor alle omgevingen (een soort basisklasse)
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9

; desktopbuddy v1 op het echte bord (Waveshare ESP32-S3-Touch-LCD-2.8)
[env:v1]
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; desktopbuddy v1 in de Wokwi-simulator
[env:v1-wokwi]
build_flags =
    -DWOKWI
