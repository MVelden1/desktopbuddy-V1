; desktopbuddy: per versie en per doel een eigen omgeving (env)
;   pio run                       bouwt de standaard (Wokwi)
;   pio run -e v1-jingcai         bouwt voor het echte bord
;   pio run -e v1-jingcai -t upload   bouwt en zet het op het bord

[platformio]
; wat "Build" standaard bouwt
default_envs = v1-wokwi

; geldt voor alle omgevingen (een soort basisklasse)
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9

; desktopbuddy v1 op het echte bord: Jingcai ESP32-3248S035C
; gewone ESP32 (geen S3), 4 MB flash, geen PSRAM, USB via CH340C
[env:v1-jingcai]
board = esp32dev
board_build.flash_size = 4MB
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_JINGCAI

; desktopbuddy v1 in de Wokwi-simulator (ESP32-S3 met ILI9341)
[env:v1-wokwi]
board = esp32-s3-devkitc-1
build_flags =
    -DWOKWI
